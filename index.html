<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Rapor Digital - Neon Glow</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Orbitron & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        
        .loader-spinner {
            border-top-color: #06b6d4;
            animation: spinner 1s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes slideIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .toast-animate { animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* Custom Glow Effects */
        .glow-box { box-shadow: 0 0 20px rgba(6, 182, 212, 0.15); }
        .glow-box-emerald { box-shadow: 0 0 20px rgba(16, 185, 129, 0.2); }
        .glow-text-cyan { text-shadow: 0 0 10px rgba(6, 182, 212, 0.6); }
        .glow-text-emerald { text-shadow: 0 0 10px rgba(16, 185, 129, 0.6); }
        
        input:focus, select:focus {
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.4) !important;
            border-color: #06b6d4 !important;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-cyan-500 selection:text-black">

    <!-- OVERLAY LOADING -->
    <div id="loading" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center hidden z-50">
        <div class="bg-slate-900 p-6 rounded-2xl flex items-center gap-4 border border-cyan-500/40 glow-box">
            <div class="loader-spinner ease-linear rounded-full border-4 border-t-4 border-slate-800 h-9 w-9"></div>
            <span class="text-cyan-400 font-medium tracking-wide">Memproses data...</span>
        </div>
    </div>

    <!-- TOAST NOTIFIKASI -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-3 max-w-sm"></div>

    <!-- MAIN CONTAINER -->
    <div class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6">

        <!-- VIEW 1: FORM LOGIN -->
        <div id="view-login" class="max-w-md mx-auto my-12 bg-slate-900/90 backdrop-blur-xl p-8 rounded-3xl border border-cyan-500/30 glow-box">
            <div class="text-center mb-8">
                <img src="./logo.png" alt="Logo Sekolah" class="w-24 h-24 mx-auto mb-4 object-contain drop-shadow-[0_0_15px_rgba(6,182,212,0.5)]" onerror="this.onerror=null; this.src='https://via.placeholder.com/100/0f172a/06b6d4?text=LOGO';">
                <h2 class="text-2xl font-bold font-orbitron text-cyan-400 tracking-wider glow-text-cyan">e-RAPOR DIGITAL</h2>
                <p class="text-xs text-slate-400 mt-1 uppercase tracking-widest">Portal Access System</p>
            </div>

            <form id="form-login" onsubmit="handleLogin(event)" class="space-y-5">
                <div>
                    <label class="block text-cyan-400 text-xs font-semibold uppercase tracking-wider mb-2">Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-cyan-500/60"><i class="fa-solid fa-user"></i></span>
                        <input type="text" id="username" required autocomplete="username" placeholder="Masukkan username" class="w-full pl-10 pr-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-cyan-300 focus:outline-none transition">
                    </div>
                </div>
                <div>
                    <label class="block text-cyan-400 text-xs font-semibold uppercase tracking-wider mb-2">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-cyan-500/60"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••" class="w-full pl-10 pr-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-cyan-300 focus:outline-none transition">
                    </div>
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 font-bold py-3 rounded-xl shadow-[0_0_20px_rgba(6,182,212,0.4)] hover:shadow-[0_0_25px_rgba(6,182,212,0.6)] transition duration-200 flex justify-center items-center gap-2 font-orbitron uppercase text-sm">
                    <span>Masuk Sistem</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </form>
        </div>

        <!-- VIEW 2: DASHBOARD UTAMA -->
        <div id="view-dashboard" class="hidden space-y-6">
            
            <!-- Header Elegan -->
            <div class="bg-slate-900/80 p-5 rounded-2xl border border-cyan-500/20 flex flex-col md:flex-row justify-between items-center gap-4 glow-box">
                <div class="flex items-center gap-4">
                    <img src="./logo.png" alt="Logo Sekolah" class="w-12 h-12 object-contain drop-shadow-[0_0_10px_rgba(6,182,212,0.5)] hidden sm:block" onerror="this.onerror=null; this.src='https://via.placeholder.com/48/0f172a/06b6d4?text=LOGO';">
                    <div>
                        <h1 class="text-xl font-bold font-orbitron text-cyan-400 glow-text-cyan">PENGINPUTAN e-RAPOR</h1>
                        <p class="text-xs text-slate-400 mt-0.5">Wali Kelas: <span id="user-nama" class="font-semibold text-emerald-400"></span> | Rombel: <span id="user-rombel" class="font-bold text-cyan-300"></span></p>
                    </div>
                </div>
                <button onclick="logout()" class="px-4 py-2 rounded-xl text-xs font-semibold text-rose-400 bg-rose-950/40 border border-rose-500/30 hover:bg-rose-900/50 transition flex items-center gap-2">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Keluar</span>
                </button>
            </div>

            <!-- Tab Navigation -->
            <div class="flex bg-slate-900 p-1 rounded-xl w-fit gap-1 border border-slate-800">
                <button id="tab-btn-nilai" onclick="switchTab('nilai')" class="py-2.5 px-5 font-semibold text-xs rounded-lg transition-all bg-cyan-500 text-slate-950 shadow-[0_0_15px_rgba(6,182,212,0.4)]">
                    <i class="fa-solid fa-pen-to-square mr-1.5"></i> Input Nilai Mapel
                </button>
                <button id="tab-btn-absensi" onclick="switchTab('absensi')" class="py-2.5 px-5 font-semibold text-xs rounded-lg transition-all text-slate-400 hover:text-cyan-400">
                    <i class="fa-solid fa-clipboard-user mr-1.5"></i> Absensi & Catatan Walas
                </button>
            </div>

            <!-- TAB CONTENT 1: INPUT NILAI MAPEL -->
            <div id="tab-content-nilai" class="space-y-6">
                <!-- Filter Mapel & Max Score Setup -->
                <div class="bg-slate-900/80 p-5 rounded-2xl border border-slate-800 space-y-4">
                    <div class="flex flex-wrap gap-4 items-center">
                        <label class="text-sm font-semibold text-cyan-400">Pilih Mata Pelajaran:</label>
                        <select id="select-mapel" onchange="loadNilai()" class="bg-slate-950 border border-slate-800 text-cyan-300 px-4 py-2 rounded-xl text-sm font-medium focus:outline-none transition">
                        </select>
                    </div>

                    <!-- Setup Batas Skor Maksimal -->
                    <div class="bg-slate-950 p-4 rounded-xl border border-cyan-500/20 flex flex-wrap gap-6 items-center text-xs">
                        <span class="font-bold text-cyan-400 uppercase tracking-wider flex items-center gap-1.5">
                            <i class="fa-solid fa-sliders text-cyan-400"></i> Batas Maksimal Nilai:
                        </span>
                        <div class="flex items-center gap-2">
                            <span class="text-slate-400">Betul-Salah:</span>
                            <input type="number" id="max-bs" value="20" oninput="recalculateAll()" class="w-16 p-1.5 border border-slate-800 rounded-lg text-center font-bold bg-slate-900 text-cyan-300">
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-slate-400">PG:</span>
                            <input type="number" id="max-pg" value="50" oninput="recalculateAll()" class="w-16 p-1.5 border border-slate-800 rounded-lg text-center font-bold bg-slate-900 text-cyan-300">
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-slate-400">Essay:</span>
                            <input type="number" id="max-essay" value="30" oninput="recalculateAll()" class="w-16 p-1.5 border border-slate-800 rounded-lg text-center font-bold bg-slate-900 text-cyan-300">
                        </div>
                        <div class="text-slate-400 font-semibold border-l pl-4 border-slate-800">
                            Total Maksimal: <span id="total-max" class="text-emerald-400 font-bold glow-text-emerald">100</span>
                        </div>
                    </div>
                </div>

                <!-- Form Tabel Nilai -->
                <div class="bg-slate-900/80 rounded-2xl border border-slate-800 overflow-hidden">
                    <form id="form-nilai" onsubmit="handleSaveNilai(event)">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm">
                                <thead>
                                    <tr class="bg-slate-950/80 border-b border-slate-800 text-xs text-cyan-400 uppercase tracking-wider">
                                        <th class="p-4 w-12 text-center">No</th>
                                        <th class="p-4 w-32">NISN</th>
                                        <th class="p-4">Nama Siswa</th>
                                        <th class="p-4 text-center w-28">Betul-Salah</th>
                                        <th class="p-4 text-center w-28">PG</th>
                                        <th class="p-4 text-center w-28">Essay</th>
                                        <th class="p-4 text-center w-28 bg-slate-950">Jumlah</th>
                                        <th class="p-4 text-center w-28 bg-cyan-950/40 text-cyan-300">Nilai Akhir</th>
                                    </tr>
                                </thead>
                                <tbody id="table-body-nilai" class="divide-y divide-slate-800/60"></tbody>
                            </table>
                        </div>
                        <div class="p-4 bg-slate-950 border-t border-slate-800 flex justify-end">
                            <button type="submit" class="bg-emerald-500 text-slate-950 font-bold px-6 py-2.5 rounded-xl shadow-[0_0_20px_rgba(16,185,129,0.3)] hover:shadow-[0_0_25px_rgba(16,185,129,0.5)] transition flex items-center gap-2 text-sm font-orbitron uppercase">
                                <i class="fa-solid fa-floppy-disk"></i>
                                <span>Simpan Semua Nilai</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- TAB CONTENT 2: ABSENSI & CATATAN WALAS -->
            <div id="tab-content-absensi" class="hidden space-y-6">
                <div class="bg-slate-900/80 rounded-2xl border border-slate-800 overflow-hidden">
                    <form id="form-absensi" onsubmit="handleSaveAbsensi(event)">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm">
                                <thead>
                                    <tr class="bg-slate-950/80 border-b border-slate-800 text-xs text-cyan-400 uppercase tracking-wider">
                                        <th class="p-4 w-12 text-center">No</th>
                                        <th class="p-4 w-32">NISN</th>
                                        <th class="p-4">Nama Siswa</th>
                                        <th class="p-4 text-center w-24">Sakit</th>
                                        <th class="p-4 text-center w-24">Izin</th>
                                        <th class="p-4 text-center w-24">Alpa</th>
                                        <th class="p-4 text-center w-28 bg-slate-950">Total Absen</th>
                                        <th class="p-4">Catatan Wali Kelas</th>
                                    </tr>
                                </thead>
                                <tbody id="table-body-absensi" class="divide-y divide-slate-800/60"></tbody>
                            </table>
                        </div>
                        <div class="p-4 bg-slate-950 border-t border-slate-800 flex justify-end">
                            <button type="submit" class="bg-emerald-500 text-slate-950 font-bold px-6 py-2.5 rounded-xl shadow-[0_0_20px_rgba(16,185,129,0.3)] hover:shadow-[0_0_25px_rgba(16,185,129,0.5)] transition flex items-center gap-2 text-sm font-orbitron uppercase">
                                <i class="fa-solid fa-floppy-disk"></i>
                                <span>Simpan Absensi & Catatan</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxxi0n55Hmw9Vr77OkzVrFUe_qyFP5lqxtXWs_1A548G-A0qa5nEPBPqo1owzPqtqw9/exec";

        let currentSession = null;
        let siswaData = [];

        function showToast(message, type = "success") {
            const container = document.getElementById("toast-container");
            const toast = document.createElement("div");

            const isSuccess = type === "success";
            const bgColor = isSuccess ? "bg-emerald-500 text-slate-950 shadow-[0_0_20px_rgba(16,185,129,0.4)]" : "bg-rose-600 text-white shadow-[0_0_20px_rgba(225,29,72,0.4)]";
            const icon = isSuccess ? "fa-circle-check" : "fa-circle-xmark";

            toast.className = `${bgColor} px-4 py-3 rounded-xl flex items-center gap-3 text-sm font-semibold toast-animate`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-lg"></i><span>${message}</span>`;

            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = "0";
                toast.style.transition = "opacity 0.4s ease";
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }

        function showLoading(show) {
            document.getElementById("loading").classList.toggle("hidden", !show);
        }

        async function apiCall(data) {
            showLoading(true);
            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    mode: "cors",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify(data),
                    redirect: "follow"
                });
                const result = await response.json();
                showLoading(false);
                return result;
            } catch (err) {
                showLoading(false);
                showToast("Terjadi kesalahan koneksi!", "error");
                console.error(err);
                return null;
            }
        }

        window.addEventListener("DOMContentLoaded", () => {
            const savedSession = localStorage.getItem("erapor_session");
            if (savedSession) {
                try {
                    currentSession = JSON.parse(savedSession);
                    displayDashboard();
                } catch (e) {
                    localStorage.removeItem("erapor_session");
                }
            }
        });

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();

            const res = await apiCall({ action: "login", username, password });

            if (res && res.success) {
                currentSession = res.data;
                localStorage.setItem("erapor_session", JSON.stringify(currentSession));
                showToast("Login Berhasil! Selamat Datang.");
                displayDashboard();
            } else if (res) {
                showToast(res.message || "Login gagal!", "error");
            }
        }

        function displayDashboard() {
            document.getElementById("user-nama").innerText = currentSession.nama;
            document.getElementById("user-rombel").innerText = currentSession.rombel;
            
            document.getElementById("view-login").classList.add("hidden");
            document.getElementById("view-dashboard").classList.remove("hidden");

            initDashboard();
        }

        function logout() {
            currentSession = null;
            localStorage.removeItem("erapor_session");
            document.getElementById("view-dashboard").classList.add("hidden");
            document.getElementById("view-login").classList.remove("hidden");
            document.getElementById("form-login").reset();
            showToast("Berhasil Keluar.");
        }

        function switchTab(tab) {
            const btnNilai = document.getElementById("tab-btn-nilai");
            const btnAbsensi = document.getElementById("tab-btn-absensi");
            const contentNilai = document.getElementById("tab-content-nilai");
            const contentAbsensi = document.getElementById("tab-content-absensi");

            if (tab === 'nilai') {
                btnNilai.className = "py-2.5 px-5 font-semibold text-xs rounded-lg transition-all bg-cyan-500 text-slate-950 shadow-[0_0_15px_rgba(6,182,212,0.4)]";
                btnAbsensi.className = "py-2.5 px-5 font-semibold text-xs rounded-lg transition-all text-slate-400 hover:text-cyan-400";
                contentNilai.classList.remove("hidden");
                contentAbsensi.classList.add("hidden");
            } else {
                btnAbsensi.className = "py-2.5 px-5 font-semibold text-xs rounded-lg transition-all bg-cyan-500 text-slate-950 shadow-[0_0_15px_rgba(6,182,212,0.4)]";
                btnNilai.className = "py-2.5 px-5 font-semibold text-xs rounded-lg transition-all text-slate-400 hover:text-cyan-400";
                contentAbsensi.classList.remove("hidden");
                contentNilai.classList.add("hidden");
                loadAbsensi();
            }
        }

        async function initDashboard() {
            const res = await apiCall({ action: "getSiswaAndMapel", rombel: currentSession.rombel });
            if (res && res.success) {
                siswaData = res.siswa;
                const mapelSelect = document.getElementById("select-mapel");
                mapelSelect.innerHTML = res.mapel.map(m => `<option value="${m}">${m}</option>`).join("");
                loadNilai();
            }
        }

        async function loadNilai() {
            const mapel = document.getElementById("select-mapel").value;
            if (!mapel) return;

            const res = await apiCall({ action: "getNilai", rombel: currentSession.rombel, mapel });
            const scores = (res && res.success) ? res.nilai : {};
            renderTableNilai(scores);
        }

        function renderTableNilai(scores) {
            const tbody = document.getElementById("table-body-nilai");
            tbody.innerHTML = "";

            if (!siswaData || siswaData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="p-4 text-center text-slate-500">Tidak ada data siswa.</td></tr>`;
                return;
            }

            siswaData.forEach((siswa, index) => {
                const s = scores[siswa.id] || { bs: 0, pg: 0, essay: 0 };
                const tr = document.createElement("tr");
                tr.className = "hover:bg-slate-800/40 transition";
                tr.innerHTML = `
                    <td class="p-3 text-center text-slate-500 font-medium">${index + 1}</td>
                    <td class="p-3 font-mono text-xs text-slate-400">${siswa.nisn}</td>
                    <td class="p-3 font-semibold text-slate-200">${siswa.nama}</td>
                    <td class="p-2 text-center"><input type="number" data-id="${siswa.id}" class="score-input bs w-20 border border-slate-800 rounded-lg text-center p-1.5 bg-slate-950 text-cyan-300" value="${s.bs}" min="0" oninput="calcRowNilai(this)"></td>
                    <td class="p-2 text-center"><input type="number" data-id="${siswa.id}" class="score-input pg w-20 border border-slate-800 rounded-lg text-center p-1.5 bg-slate-950 text-cyan-300" value="${s.pg}" min="0" oninput="calcRowNilai(this)"></td>
                    <td class="p-2 text-center"><input type="number" data-id="${siswa.id}" class="score-input essay w-20 border border-slate-800 rounded-lg text-center p-1.5 bg-slate-950 text-cyan-300" value="${s.essay}" min="0" oninput="calcRowNilai(this)"></td>
                    <td class="p-3 text-center font-bold bg-slate-950 text-slate-300 jml-cell">0</td>
                    <td class="p-3 text-center font-extrabold bg-cyan-950/40 text-cyan-400 nilai-cell glow-text-cyan">0</td>
                `;
                tbody.appendChild(tr);
                calcRowNilai(tbody.lastElementChild.querySelector('.score-input'));
            });
        }

        function calcRowNilai(element) {
            const tr = element.closest("tr");
            const bs = parseFloat(tr.querySelector(".bs").value) || 0;
            const pg = parseFloat(tr.querySelector(".pg").value) || 0;
            const essay = parseFloat(tr.querySelector(".essay").value) || 0;

            const maxBs = parseFloat(document.getElementById("max-bs").value) || 1;
            const maxPg = parseFloat(document.getElementById("max-pg").value) || 1;
            const maxEssay = parseFloat(document.getElementById("max-essay").value) || 1;

            const maxTotal = maxBs + maxPg + maxEssay;
            document.getElementById("total-max").innerText = maxTotal;

            const jumlah = bs + pg + essay;
            const nilai = (jumlah / maxTotal) * 100;

            tr.querySelector(".jml-cell").innerText = jumlah;
            tr.querySelector(".nilai-cell").innerText = nilai.toFixed(1);
        }

        function recalculateAll() {
            document.querySelectorAll("#table-body-nilai tr").forEach(tr => {
                const input = tr.querySelector(".score-input");
                if (input) calcRowNilai(input);
            });
        }

        async function handleSaveNilai(e) {
            e.preventDefault();
            const mapel = document.getElementById("select-mapel").value;
            const payloadScores = [];

            document.querySelectorAll("#table-body-nilai tr").forEach(tr => {
                const input = tr.querySelector(".score-input");
                if (input) {
                    payloadScores.push({
                        idSiswa: input.getAttribute("data-id"),
                        bs: tr.querySelector(".bs").value,
                        pg: tr.querySelector(".pg").value,
                        essay: tr.querySelector(".essay").value,
                        jumlah: tr.querySelector(".jml-cell").innerText,
                        nilai: tr.querySelector(".nilai-cell").innerText
                    });
                }
            });

            const res = await apiCall({ action: "saveNilai", rombel: currentSession.rombel, mapel, scores: payloadScores });
            if (res && res.success) showToast(res.message);
        }

        async function loadAbsensi() {
            const res = await apiCall({ action: "getAbsensi", rombel: currentSession.rombel });
            const absensiData = (res && res.success) ? res.absensi : {};
            renderTableAbsensi(absensiData);
        }

        function renderTableAbsensi(absensiData) {
            const tbody = document.getElementById("table-body-absensi");
            tbody.innerHTML = "";

            if (!siswaData || siswaData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="p-4 text-center text-slate-500">Tidak ada data siswa.</td></tr>`;
                return;
            }

            siswaData.forEach((siswa, index) => {
                const a = absensiData[siswa.id] || { sakit: 0, izin: 0, alpa: 0, catatan: "" };
                const tr = document.createElement("tr");
                tr.className = "hover:bg-slate-800/40 transition";
                tr.innerHTML = `
                    <td class="p-3 text-center text-slate-500 font-medium">${index + 1}</td>
                    <td class="p-3 font-mono text-xs text-slate-400">${siswa.nisn}</td>
                    <td class="p-3 font-semibold text-slate-200">${siswa.nama}</td>
                    <td class="p-2 text-center"><input type="number" data-id="${siswa.id}" class="absen-input sakit w-16 border border-slate-800 rounded-lg text-center p-1.5 bg-slate-950 text-cyan-300" value="${a.sakit}" min="0" oninput="calcAbsen(this)"></td>
                    <td class="p-2 text-center"><input type="number" data-id="${siswa.id}" class="absen-input izin w-16 border border-slate-800 rounded-lg text-center p-1.5 bg-slate-950 text-cyan-300" value="${a.izin}" min="0" oninput="calcAbsen(this)"></td>
                    <td class="p-2 text-center"><input type="number" data-id="${siswa.id}" class="absen-input alpa w-16 border border-slate-800 rounded-lg text-center p-1.5 bg-slate-950 text-cyan-300" value="${a.alpa}" min="0" oninput="calcAbsen(this)"></td>
                    <td class="p-3 text-center font-bold bg-slate-950 text-slate-300 jml-absen-cell">0</td>
                    <td class="p-2"><input type="text" class="catatan w-full border border-slate-800 rounded-lg p-1.5 text-sm bg-slate-950 text-cyan-200" value="${a.catatan}" placeholder="Tuliskan catatan perkembangan siswa..."></td>
                `;
                tbody.appendChild(tr);
                calcAbsen(tbody.lastElementChild.querySelector('.absen-input'));
            });
        }

        function calcAbsen(element) {
            const tr = element.closest("tr");
            const sakit = parseFloat(tr.querySelector(".sakit").value) || 0;
            const izin = parseFloat(tr.querySelector(".izin").value) || 0;
            const alpa = parseFloat(tr.querySelector(".alpa").value) || 0;

            tr.querySelector(".jml-absen-cell").innerText = sakit + izin + alpa;
        }

        async function handleSaveAbsensi(e) {
            e.preventDefault();
            const payloadAbsensi = [];

            document.querySelectorAll("#table-body-absensi tr").forEach(tr => {
                const input = tr.querySelector(".absen-input");
                if (input) {
                    payloadAbsensi.push({
                        idSiswa: input.getAttribute("data-id"),
                        sakit: tr.querySelector(".sakit").value,
                        izin: tr.querySelector(".izin").value,
                        alpa: tr.querySelector(".alpa").value,
                        catatan: tr.querySelector(".catatan").value
                    });
                }
            });

            const res = await apiCall({ action: "saveAbsensi", rombel: currentSession.rombel, absensi: payloadAbsensi });
            if (res && res.success) showToast(res.message);
        }
    </script>
</body>
</html>
